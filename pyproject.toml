[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longrange-planner"
version = "0.1.0"
description = "Open-source long-term (18-month) production planning: forecast, MPS/MRP, capacity, inventory, alerts and S&OP reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Alpha Li" }]
keywords = ["supply chain", "production planning", "MPS", "MRP", "S&OP", "forecasting", "capacity planning"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Manufacturing",
  "Topic :: Office/Business",
]
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "plotly>=5.18",
  "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
longrange = "longrange.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
