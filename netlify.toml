# Netlify: builds the serverless (in-browser) version of the dashboard.
# The site is static: Python and Streamlit run in the visitor's browser via stlite.

[build]
  command = "python3 scripts/build_site.py"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
